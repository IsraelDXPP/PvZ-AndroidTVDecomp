# Compila el juego para iPhone/iPad reales (arm64, iOS 15+) y arma un .ipa sin
# firmar (firma ad-hoc) listo para re-firmar e instalar con Sideloadly/AltStore.
#
# Los assets del juego (copyright PopCap) no estan en el repositorio. Sin
# GAME_ASSETS_URL el .app sale sin assets; con la variable pointed to un zip,
# el workflow lo baja y lo mete en el bundle.
name: ios

on:
  push:
    branches: [main]
    paths:
      - 'Lawn/**'
      - 'Sexy/**'
      - 'TodLib/**'
      - 'cmake/**'
      - 'ios/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IPA_NAME: LawnTV-unsigned.ipa
  APP: Payload/LawnTV.app
  DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode y herramientas
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          which ninja || brew install ninja
          python3 --version

      - name: vcpkg en el commit baseline del proyecto
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          # El baseline de vcpkg.json fija la version de los ports. El tool
          # tiene que ser el de ese commit: uno mas viejo no entiende el
          # esquema de scripts/vcpkg-tools.json de ese commit.
          git checkout "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")"
          ./bootstrap-vcpkg.sh -disableMetrics
          cd ..
          # vcpkg exige que el destino de la cache sea un directorio.
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$PWD/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$PWD/vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ios-${{ hashFiles('vcpkg.json') }}

      - name: Configurar (iOS arm64)
        run: |
          cmake --preset ios-arm64-release
          cmake --build --preset ios-arm64-release --parallel

      - name: Empaquetar .app
        run: |
          EXE=build/ios-arm64-release/bin/Release/LawnTV
          file "$EXE"
          nm "$EXE" | grep -E " T _main$| T _SDL_main$" || (echo "FALTA main/SDL_main" && exit 1)
          rm -rf Payload
          mkdir -p "$APP/Base.lproj"
          cp "$EXE" "$APP/LawnTV"
          cp ios/Info.plist "$APP/"
          plutil -lint "$APP/Info.plist"
          # El storyboard se compila y los iconos los pone actool desde
          # ios/Assets.xcassets (CFBundleIconName = AppIcon en el Info.plist).
          ibtool --compile "$APP/Base.lproj/LaunchScreen.storyboardc" ios/LaunchScreen.storyboard
          xcrun actool --compile "$APP" --platform iphoneos --minimum-deployment-target "$DEPLOYMENT_TARGET" \
            --target-device iphone --target-device ipad --app-icon AppIcon \
            --output-partial-info-plist /tmp/actool-partial.plist \
            --output-format human-readable-text ios/Assets.xcassets
          ls "$APP" | head -20

      - name: Assets del juego
        if: ${{ vars.GAME_ASSETS_URL != '' }}
        env:
          GAME_ASSETS_URL: ${{ vars.GAME_ASSETS_URL }}
        run: |
          curl -fsSL "$GAME_ASSETS_URL" -o /tmp/assets.zip
          unzip -q /tmp/assets.zip -d /tmp/assets
          # El bundle lleva los recursos en assets/; el juego busca tambien
          # assets/files, que es la forma de los packs de TV.
          mkdir -p "$APP/assets"
          cp -R /tmp/assets/. "$APP/assets/"
          ls "$APP/assets" | head

      - name: Firma ad-hoc e IPA
        run: |
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: LawnTV-unsigned-ipa
          path: ${{ env.IPA_NAME }}
