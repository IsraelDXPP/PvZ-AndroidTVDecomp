# Compila el juego para escritorio (Windows x64/x86, macOS arm64/x64, Linux
# x64/arm64), Android (arm64-v8a, armeabi-v7a, x86_64, x86) e iOS arm64 en
# el job ios (.ipa sin firmar). Los assets del juego (copyright PopCap) no estan en el repositorio:
# los binarios salen sin assets.
name: build

on:
  push:
    branches: [main]
    paths:
      - 'Lawn/**'
      - 'Sexy/**'
      - 'TodLib/**'
      - 'cmake/**'
      - 'android/**'
      - 'ios/**'
      - 'Shaders/**'
      - 'Levels/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: windows-x64-release, os: windows-2022, arch: x64 }
          - { preset: windows-x86-release, os: windows-2022, arch: x86 }
          - { preset: macos-arm64-release, os: macos-15 }
          - { preset: macos-x64-release,   os: macos-15-intel }
          - { preset: linux-x64-release,   os: ubuntu-24.04 }
          - { preset: linux-arm64-release, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libibus-1.0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxtst-dev \
            libasound2-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libltdl-dev

      - name: Dependencias del sistema (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config || true

      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Entorno MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: vcpkg en el commit baseline del proyecto
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          git checkout "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")"
          if [ "$RUNNER_OS" = "Windows" ]; then ./bootstrap-vcpkg.bat -disableMetrics; else ./bootstrap-vcpkg.sh -disableMetrics; fi
          cd ..
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: Configurar
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: LawnTV-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/bin/Release/
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK, NDK y herramientas
        run: |
          # El runner ya trae el SDK de Android; solo se agregan las piezas pedidas.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf automake libtool pkg-config
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: vcpkg en el commit baseline del proyecto
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          git checkout "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")"
          ./bootstrap-vcpkg.sh -disableMetrics
          cd ..
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$PWD/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$PWD/vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-android-${{ matrix.abi }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Firma (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/keystore.properties
          fi

      - name: APK (release)
        working-directory: android
        run: sh ./gradlew :app:assembleRelease -PlawnAbis=${{ matrix.abi }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LawnTV-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: ios-arm64
    runs-on: macos-15
    env:
      IPA_NAME: LawnTV-unsigned.ipa
      APP: Payload/LawnTV.app
      DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4

      - name: Xcode y herramientas
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          which ninja || brew install ninja
          python3 --version

      - name: vcpkg en el commit baseline del proyecto
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          # El baseline de vcpkg.json fija la version de los ports. El tool
          # tiene que ser el de ese commit: uno mas viejo no entiende el
          # esquema de scripts/vcpkg-tools.json de ese commit.
          git checkout "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")"
          ./bootstrap-vcpkg.sh -disableMetrics
          cd ..
          # vcpkg exige que el destino de la cache sea un directorio.
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$PWD/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$PWD/vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ios-${{ hashFiles('vcpkg.json') }}

      - name: Configurar (iOS arm64)
        run: |
          cmake --preset ios-arm64-release
          cmake --build --preset ios-arm64-release --parallel

      - name: Empaquetar .app
        run: |
          APP_BUNDLE=build/ios-arm64-release/bin/Release/LawnTV.app
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "ERROR: No existe el bundle $APP_BUNDLE"
            ls -la build/ios-arm64-release/bin/Release/
            exit 1
          fi
          EXE="$APP_BUNDLE/LawnTV"
          file "$EXE"
          nm "$EXE" | grep -E " T _main$| T _SDL_main$" || (echo "FALTA main/SDL_main" && exit 1)
          rm -rf Payload
          APP=Payload/LawnTV.app
          mkdir -p "$APP/Base.lproj"
          # Copiar el ejecutable al nuevo bundle
          cp "$EXE" "$APP/LawnTV"
          # Info.plist base + assets
          cp ios/Info.plist "$APP/"
          plutil -lint "$APP/Info.plist"
          ibtool --compile "$APP/Base.lproj/LaunchScreen.storyboardc" ios/LaunchScreen.storyboard
          xcrun actool --compile "$APP" --platform iphoneos --minimum-deployment-target "$DEPLOYMENT_TARGET" \
            --target-device iphone --target-device ipad --app-icon AppIcon \
            --output-partial-info-plist /tmp/actool-partial.plist \
            --output-format human-readable-text ios/Assets.xcassets
          ls -la "$APP"

      - name: Assets del juego
        env:
          GAME_ASSETS_URL: https://drive.usercontent.google.com/download?id=1h-Cvuf4Zz3SVjRXbpoBetR9Z-ZzQ-R5D&export=download&confirm=t
        run: |
          curl -fsSL "$GAME_ASSETS_URL" -o /tmp/assets.zip
          unzip -q /tmp/assets.zip -d /tmp/assets
          # El zip de Drive viene plano: reestructurar en las carpetas que el
          # juego lee (properties/, images/, reanim/, data/, sounds/,
          # shaders/). resources.xml pide images/, data/, reanim/, sounds/
          # y el codigo lee properties/levels.xml y properties/resources.xml.
          mkdir -p "$APP/assets/properties" "$APP/assets/images" "$APP/assets/reanim" \
                   "$APP/assets/data" "$APP/assets/sounds" "$APP/assets/shaders"
          mv /tmp/assets/*.xml "$APP/assets/properties/" 2>/dev/null || true
          mv /tmp/assets/*.txt "$APP/assets/data/" 2>/dev/null || true
          mv /tmp/assets/*.{ogg,wav,xm,mpg} "$APP/assets/sounds/" 2>/dev/null || true
          mv /tmp/assets/*.scbp "$APP/assets/shaders/" 2>/dev/null || true
          mv /tmp/assets/*.reanim.compiled "$APP/assets/reanim/" 2>/dev/null || true
          mv /tmp/assets/*.compiled "$APP/assets/reanim/" 2>/dev/null || true
          mv /tmp/assets/*.png /tmp/assets/*.jpg /tmp/assets/*.gif "$APP/assets/images/" 2>/dev/null || true
          ls "$APP/assets" | head

      - name: Firma ad-hoc e IPA
        run: |
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: LawnTV-unsigned-ipa
          path: ${{ env.IPA_NAME }}
